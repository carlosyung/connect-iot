name: Daily update

# Builds the homepage and pushes it to the `site` branch.
# Cloudflare Pages watches `site` and publishes every new push to connect-iot.com.

on:
  schedule:
    # 22:00 UTC = 06:00 Hong Kong time, every day.
    # To update more often, e.g. every 6 hours: "0 */6 * * *"
    - cron: "0 22 * * *"
  push:
    branches: [main]
    # Daily briefing commits touch only content/; don't let them re-trigger the build
    paths-ignore: ["content/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          # Daily briefing: Gemini first, Cloudflare Workers AI as backup.
          # All optional; without them the site still updates, just without the briefing.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save new briefings to main
        run: |
          git add content/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Daily briefing $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            git push -q origin HEAD:main
          fi
      - name: Publish dist/ to the site branch
        run: |
          cd dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M HKT')"
          # Force-push a single commit so the branch never accumulates history
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
