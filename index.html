<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect-IoT｜香港科技・AI・IoT 新聞</title>
<meta name="description" content="Connect-IoT：每日自動更新的香港新聞、AI、LLM、物聯網 IoT 及科技資訊首頁。">
<meta property="og:title" content="Connect-IoT">
<meta property="og:description" content="每日更新：香港新聞、AI・LLM、IoT、科技、財經、天氣">

<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --card-2:#f6f8fb; --text:#16202c; --muted:#5d6b7c; --line:#e3e8ef;
  --brand:#0a6cff; --brand-2:#00b3a4; --up:#0f9d58; --down:#d93025; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --hero-grad:linear-gradient(135deg,#0a3d91 0%,#0a6cff 45%,#00b3a4 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --card:#18202b; --card-2:#1f2935; --text:#e7edf5; --muted:#98a6b8; --line:#273241;
  --brand:#5aa2ff; --brand-2:#33d1c3; --up:#34c77b; --down:#ff6b5e; --shadow:none;
  --hero-grad:linear-gradient(135deg,#071d45 0%,#0b3f8f 50%,#006e66 100%);
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#18202b; --card-2:#1f2935; --text:#e7edf5; --muted:#98a6b8; --line:#273241;
  --brand:#5aa2ff; --brand-2:#33d1c3; --up:#34c77b; --down:#ff6b5e; --shadow:none;
  --hero-grad:linear-gradient(135deg,#071d45 0%,#0b3f8f 50%,#006e66 100%);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* Top banner */
.banner{background:var(--hero-grad);color:#fff;padding:18px 16px 70px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 15% 120%,rgba(255,255,255,.12) 0 18%,transparent 19%),
  radial-gradient(circle at 85% -20%,rgba(255,255,255,.10) 0 22%,transparent 23%);pointer-events:none}
.bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:32px;height:32px}
.clock{margin-left:auto;text-align:right;font-size:13px;opacity:.9;white-space:nowrap}
.clock b{font-size:18px;font-weight:600;display:block;line-height:1.2}
.theme-btn{background:rgba(255,255,255,.15);border:0;border-radius:999px;width:36px;height:36px;cursor:pointer;color:#fff;display:grid;place-items:center}
.search{max-width:680px;margin:26px auto 0;position:relative;z-index:1}
.search form{display:flex;background:#fff;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden}
.search input{flex:1;border:0;padding:14px 22px;font:inherit;font-size:16px;outline:none;color:#16202c;min-width:0;background:transparent}
.search button{border:0;background:var(--brand);color:#fff;padding:0 22px;cursor:pointer;font-weight:600}

/* Main */
main{max-width:1320px;margin:-48px auto 40px;padding:0 16px;position:relative;z-index:2}
.tabs-wrap{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{background:var(--card-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}
.updated{font-size:12px;color:var(--muted);white-space:nowrap;padding-right:10px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.span2{grid-column:span 2}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-weight:600;font-size:14px}
.card-h .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.card-h .more{margin-left:auto;font-weight:500;font-size:12px;color:var(--brand);cursor:pointer;background:none;border:0}

/* Article card */
.art .thumb{aspect-ratio:16/9;background:var(--card-2);position:relative;overflow:hidden}
.art .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.art:hover .thumb img{transform:scale(1.04)}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;letter-spacing:.02em}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.25) 0 12%,transparent 13%),radial-gradient(circle at 10% 90%,rgba(255,255,255,.15) 0 20%,transparent 21%)}
.art .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.meta .src{font-weight:600;color:var(--text);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--card-2);color:var(--muted);white-space:nowrap}
.art h3{margin:0;font-size:16px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art:hover h3{color:var(--brand)}
.art p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Hero */
.hero-card .hero{height:100%}
.hero{display:grid;grid-template-columns:1.25fr 1fr;min-height:340px}
.slides{position:relative;overflow:hidden;background:#0b1a2e}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:block}
.slide.on{opacity:1;z-index:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 34px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.slide .cap small{opacity:.85;font-size:12px}
.slide .cap h2{margin:4px 0 0;font-size:21px;line-height:1.35}
.dots{position:absolute;bottom:12px;left:18px;display:flex;gap:6px;z-index:2}
.dots button{width:18px;height:4px;border-radius:2px;border:0;background:rgba(255,255,255,.4);cursor:pointer;padding:0}
.dots button.on{background:#fff;width:28px}
.headlines{list-style:none;margin:0;padding:10px 16px 12px;display:flex;flex-direction:column}
.headlines li{border-bottom:1px solid var(--line)}
.headlines li:last-child{border:0}
.headlines a{display:flex;gap:10px;padding:9px 0;font-size:14px;line-height:1.4}
.headlines a:hover span{color:var(--brand)}
.headlines .n{flex:none;width:20px;height:20px;border-radius:6px;background:var(--card-2);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.headlines li:nth-child(-n+3) .n{background:var(--brand);color:#fff}
.headlines span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Weather */
.weather{background:linear-gradient(160deg,#1f6fd1,#48a4f0);color:#fff}
.weather .card-h{color:#fff}
.w-now{display:flex;align-items:center;gap:12px;padding:4px 16px}
.w-now img{width:64px;height:64px}
.w-temp{font-size:48px;font-weight:300;line-height:1}
.w-temp sup{font-size:20px}
.w-sub{font-size:13px;opacity:.9}
.w-warn{margin:8px 16px 0;padding:6px 10px;border-radius:8px;background:rgba(255,200,0,.25);font-size:12px}
.w-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:12px 10px 8px;text-align:center;font-size:12px}
.w-days img{width:30px;height:30px;display:block;margin:2px auto}
.w-days b{font-weight:600}
.w-sit{padding:4px 16px 14px;font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Markets */
.mk{list-style:none;margin:0;padding:4px 16px 12px}
.mk li{display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.mk li:last-child{border:0}
.mk .nm{font-weight:600}
.mk .px{font-size:12px;color:var(--muted)}
.mk .chg{font-weight:600;text-align:right;min-width:62px}
.up{color:var(--up)} .down{color:var(--down)}
.fx{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 16px 14px}
.fx div{background:var(--card-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.fx b{display:block;font-size:15px;color:var(--text)}

/* List card (ranking / gov) */
.list{list-style:none;margin:0;padding:2px 16px 12px}
.list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.list li:last-child{border:0}
.list a:hover{color:var(--brand)}
.list small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* Daily briefing */
.brief{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:1px solid var(--line)}
.brief .lead-col{padding:20px 22px;background:linear-gradient(135deg,rgba(10,108,255,.08),rgba(0,179,164,.08))}
.brief .kick{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.06em}
.brief h2{margin:6px 0 8px;font-size:22px;line-height:1.35}
.brief h2 a:hover{color:var(--brand)}
.brief p{margin:0 0 12px;color:var(--muted);font-size:14px}
.brief .go{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600}
.brief .arch{margin-left:12px;font-size:13px;color:var(--brand)}
.brief ul{list-style:none;margin:0;padding:14px 20px}
.brief li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:8px;align-items:baseline}
.brief li:last-child{border:0}
.brief li .pill{flex:none}
@media (max-width:820px){.brief{grid-template-columns:minmax(0,1fr)}}

.section-title{grid-column:1/-1;font-size:18px;font-weight:700;margin:12px 0 -4px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
footer{max-width:1320px;margin:0 auto;padding:24px 16px 40px;color:var(--muted);font-size:12px;text-align:center}
footer a{color:var(--brand)}

@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-card{grid-column:span 3}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-card{grid-column:span 2}.hero{grid-template-columns:minmax(0,1fr)}.slides{min-height:260px}}
@media (max-width:560px){
  .grid{grid-template-columns:minmax(0,1fr)}.span2,.hero-card{grid-column:auto}
  .clock span{display:none}.logo{font-size:17px}.updated{display:none}
  .banner{padding-bottom:64px}.slide .cap h2{font-size:18px}
}
</style>
</head>

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function ago(iso){
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s/60)) + " 分鐘前";
  if (s < 86400) return Math.round(s/3600) + " 小時前";
  if (s < 86400*7) return Math.round(s/86400) + " 日前";
  return new Date(iso).toLocaleDateString("zh-HK",{month:"short",day:"numeric"});
}
const link = (href, cls, ...kids) => el("a", {href, class:cls, target:"_blank", rel:"noopener"}, ...kids);
const hkoIcon = n => `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${n}.png`;
function img(src, alt, onFail){
  const i = el("img", {src, alt:alt||"", loading:"lazy", referrerpolicy:"no-referrer"});
  i.onerror = onFail || (() => i.remove());
  return i;
}
function byTime(a,b){ return (b.time||"").localeCompare(a.time||""); }

/* ---------- article card ---------- */
function articleCard(a, opts={}){
  const meta = el("div",{class:"meta"}, el("span",{class:"src"},a.source), a.time ? "· "+ago(a.time) : null,
                   opts.pill ? el("span",{class:"pill",style:"margin-left:auto"},CAT_NAME[a.cat]||"") : null);
  const body = el("div",{class:"body"}, meta, el("h3",null,a.title), a.summary && !opts.noSummary ? el("p",null,a.summary) : null);
  const thumb = el("div",{class:"thumb"});
  thumb.append(a.image ? img(a.image, "", function(){ this.replaceWith(placeholder(a)); }) : placeholder(a));
  return link(a.link, "card art" + (opts.span2?" span2":""), thumb, body);
}
function placeholder(a){
  return el("div",{class:"ph",style:`background:${CAT_GRAD[a.cat]||CAT_GRAD.tech}`}, CAT_NAME[a.cat]||"");
}

/* ---------- hero ---------- */
function heroCard(pool, listItems){
  const slidesData = pool.filter(a => a.image).slice(0,6);
  const slides = el("div",{class:"slides"});
  const dots = el("div",{class:"dots"});
  let idx = 0, timer;
  const show = i => {
    idx = (i + slidesData.length) % slidesData.length;
    [...slides.querySelectorAll(".slide")].forEach((s,j)=>s.classList.toggle("on", j===idx));
    [...dots.children].forEach((d,j)=>d.classList.toggle("on", j===idx));
  };
  slidesData.forEach((a,i) => {
    slides.append(link(a.link, "slide"+(i?"":" on"),
      img(a.image, "", function(){ this.replaceWith(placeholder(a)); }),
      el("div",{class:"cap"}, el("small",null, a.source + " · " + ago(a.time)), el("h2",null,a.title))));
    dots.append(el("button",{"aria-label":"第 "+(i+1)+" 則", class:i?"":"on", onclick:e=>{e.preventDefault();show(i);restart();}}));
  });
  slides.append(dots);
  const restart = () => { clearInterval(timer); if (slidesData.length > 1) timer = setInterval(()=>show(idx+1), 6000); };
  restart();
  slides.addEventListener("mouseenter", ()=>clearInterval(timer));
  slides.addEventListener("mouseleave", restart);

  const used = new Set(slidesData.map(a=>a.link));
  const heads = listItems.filter(a=>!used.has(a.link)).slice(0,8);
  const list = el("ul",{class:"headlines"}, heads.map((a,i)=>el("li",null, link(a.link,null, el("b",{class:"n"},String(i+1)), el("span",null,a.title)))));
  heads.forEach(a=>used.add(a.link));
  return {node: el("div",{class:"card span2 hero-card"}, el("div",{class:"hero"}, slidesData.length ? slides : null, list)), used};
}

/* ---------- widgets ---------- */
function weatherCard(w){
  if (!w) return null;
  const card = el("div",{class:"card weather"});
  const render = w => {
    card.replaceChildren(
      el("div",{class:"card-h"}, "☀︎ 香港天氣 · 香港天文台"),
      el("div",{class:"w-now"}, img(hkoIcon(w.icon), "天氣圖示"),
        el("div",null, el("div",{class:"w-temp"}, String(w.temp), el("sup",null,"°C")), el("div",{class:"w-sub"}, "濕度 "+w.humidity+"%"))),
      ...(w.warning||[]).slice(0,2).map(t=>el("div",{class:"w-warn"}, "⚠ "+t)),
      el("div",{class:"w-days"}, (w.forecast||[]).map(f=>el("div",null,
        el("div",null,f.week.replace("星期","週")), img(hkoIcon(f.icon), f.text), el("b",null,f.max+"°"), el("div",{style:"opacity:.75"},f.min+"°")))),
      el("div",{class:"w-sit"}, w.situation||"")
    );
  };
  render(w);
  // Refresh current conditions live (HKO API allows cross-origin requests)
  const base = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?lang=tc&dataType=";
  Promise.all([fetch(base+"rhrread").then(r=>r.json()), fetch(base+"fnd").then(r=>r.json())]).then(([now,fnd])=>{
    const t = now.temperature.data.find(d=>d.place==="香港天文台") || now.temperature.data[0];
    render({
      temp:t.value, humidity:now.humidity.data[0].value, icon:(now.icon||[50])[0],
      warning:(now.warningMessage||[]).filter(Boolean), situation:fnd.generalSituation,
      forecast:fnd.weatherForecast.slice(0,7).map(f=>({week:f.week,min:f.forecastMintemp.value,max:f.forecastMaxtemp.value,icon:f.ForecastIcon,text:f.forecastWeather}))
    });
  }).catch(()=>{});
  return card;
}

function spark(values, up){
  if (!values || values.length < 2) return el("span");
  const min = Math.min(...values), max = Math.max(...values), r = (max-min)||1;
  const pts = values.map((v,i)=>`${(i/(values.length-1)*64).toFixed(1)},${(22-(v-min)/r*20).toFixed(1)}`).join(" ");
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 64 24"); svg.setAttribute("width","64"); svg.setAttribute("height","24");
  const pl = document.createElementNS("http://www.w3.org/2000/svg","polyline");
  pl.setAttribute("points", pts); pl.setAttribute("fill","none"); pl.setAttribute("stroke-width","1.6");
  pl.setAttribute("stroke", up ? "var(--up)" : "var(--down)"); pl.setAttribute("stroke-linejoin","round");
  svg.append(pl);
  return svg;
}
function marketsCard(markets, fx){
  if (!(markets||[]).length && !(fx||[]).length) return null;
  const fmt = (n, d=2) => n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  return el("div",{class:"card"},
    el("div",{class:"card-h"}, el("span",{class:"dot",style:"background:#f59e0b"}), "市場 Markets"),
    el("ul",{class:"mk"}, markets.map(m=>{
      const up = m.change >= 0;
      return el("li",null, el("div",null, el("div",{class:"nm"},m.name), el("div",{class:"px"}, fmt(m.price))),
        spark(m.spark, up), el("div",{class:"chg "+(up?"up":"down")}, (up?"+":"")+m.change.toFixed(2)+"%"));
    })),
    fx.length ? el("div",{class:"fx"}, fx.slice(0,4).map(f=>el("div",null, f.code+" → HKD", el("b",null, fmt(f.rate, f.code==="JPY"?4:3))))) : null
  );
}
function listCard(title, color, items, withSource){
  if (!items.length) return null;
  return el("div",{class:"card"},
    el("div",{class:"card-h"}, el("span",{class:"dot",style:"background:"+color}), title),
    el("ul",{class:"list"}, items.map(a=>el("li",null, link(a.link,null,a.title), withSource ? el("small",null, a.source+" · "+ago(a.time)) : null))));
}

function briefingCard(b){
  if (!b) return null;
  const d = new Date(b.date + "T00:00:00+08:00").toLocaleDateString("zh-HK",{month:"long",day:"numeric",weekday:"short",timeZone:"Asia/Hong_Kong"});
  return el("div",{class:"card brief"},
    el("div",{class:"lead-col"},
      el("div",{class:"kick"}, "今日重點 DAILY BRIEFING · " + d),
      el("h2",null, el("a",{href:b.url}, b.title)),
      el("p",null, b.summary),
      el("a",{class:"go",href:b.url}, "閱讀全文 →"),
      el("a",{class:"arch",href:"briefing/"}, "往期重點")),
    el("ul",null, b.points.map(p=>el("li",null, el("span",{class:"pill"},p.topic), el("a",{href:b.url}, p.headline)))));
}

/* ---------- page ---------- */
let current = "top";
function render(){
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  const all = DATA.articles.filter(a=>a.cat!=="gov");
  const add = n => n && grid.append(n);

  if (current === "top"){
    add(briefingCard(DATA.briefing));
    // Mix: newest items with images from each category for the carousel
    const mix = [];
    for (const c of ["hk","ai","iot","tech"]) mix.push(...all.filter(a=>a.cat===c && a.image).sort(byTime).slice(0,2));
    const hkList = all.filter(a=>a.cat==="hk").sort(byTime);
    const {node, used} = heroCard(mix.sort(byTime), hkList);
    add(node);
    add(weatherCard(DATA.weather));
    add(marketsCard(DATA.markets, DATA.fx));

    const rest = all.filter(a=>!used.has(a.link));
    const pick = (cat, n) => { const r = rest.filter(a=>a.cat===cat && !used.has(a.link)).sort(byTime).slice(0,n); r.forEach(a=>used.add(a.link)); return r; };
    const sections = [
      ["AI・LLM", "ai", 7], ["IoT 物聯網", "iot", 7], ["香港 Hong Kong", "hk", 7],
      ["科技 Technology", "tech", 7], ["財經 Finance", "finance", 3], ["國際 World", "world", 3],
    ];
    for (const [title, cat, n] of sections){
      add(el("div",{class:"section-title"}, title));
      const items = pick(cat, n);
      items.forEach((a,i)=>add(articleCard(a, {span2: i===0 && !!a.image})));
      if (cat === "ai") add(listCard("Hacker News 熱門", "#ff6600", DATA.articles.filter(a=>a.source==="Hacker News").slice(0,8), false));
      if (cat === "hk") add(listCard("政府新聞公報", "#10b981", DATA.articles.filter(a=>a.cat==="gov").slice(0,8), true));
    }
  } else {
    const items = all.filter(a=>a.cat===current).sort(byTime);
    const withImg = items.filter(a=>a.image);
    const {node, used} = heroCard(withImg, items);
    add(node);
    if (current === "hk") add(weatherCard(DATA.weather));
    if (current === "finance") add(marketsCard(DATA.markets, DATA.fx));
    if (current === "hk") add(listCard("政府新聞公報", "#10b981", DATA.articles.filter(a=>a.cat==="gov").slice(0,10), true));
    items.filter(a=>!used.has(a.link)).forEach(a=>add(articleCard(a)));
  }
}

function initTabs(){
  const tabs = document.getElementById("tabs");
  let saved; try { saved = localStorage.getItem("ciot-tab"); } catch(e){}
  if (CATS.some(c=>c.id===saved)) current = saved;
  const sync = () => [...tabs.children].forEach(b=>b.setAttribute("aria-selected", b.dataset.id===current));
  CATS.forEach(c=>tabs.append(el("button",{class:"tab",role:"tab","data-id":c.id,onclick:()=>{
    current = c.id; try { localStorage.setItem("ciot-tab", current); } catch(e){}
    sync(); render(); window.scrollTo({top:0,behavior:"smooth"});
  }}, c.label)));
  sync();
}

function initClock(){
  const t = document.getElementById("time"), d = document.getElementById("date");
  const tick = () => {
    const now = new Date();
    t.textContent = now.toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Hong_Kong"});
    d.textContent = now.toLocaleDateString("zh-HK",{year:"numeric",month:"long",day:"numeric",weekday:"long",timeZone:"Asia/Hong_Kong"});
  };
  tick(); setInterval(tick, 15000);
}

function initTheme(){
  const root = document.documentElement;
  let saved; try { saved = localStorage.getItem("ciot-theme"); } catch(e){}
  if (saved) root.dataset.theme = saved;
  document.getElementById("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("ciot-theme", root.dataset.theme); } catch(e){}
  };
}

initTheme();
initClock();
document.getElementById("yr").textContent = new Date().getFullYear();
document.getElementById("updated").textContent = "更新於 " + new Date(DATA.updated).toLocaleString("zh-HK",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Hong_Kong"});
initTabs();
render();
</script>
